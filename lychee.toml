# Konfigurace lychee link checkeru
# https://lychee.cli.rs/

max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8

# 429 = rate limit (YouTube/GitHub při stovkách odkazů) – neznamená mrtvý odkaz
accept = ["200..=299", "429"]

# Platformy, které boty blokují nebo vrací nesmysly (403/999/login wall).
# Kontrola by hlásila falešné chyby – tyhle odkazy kontroluj ručně.
exclude = [
  '^https?://(www\.)?(x|twitter)\.com/',
  '^https?://(www\.)?linkedin\.com/',
  '^https?://(www\.)?instagram\.com/',
  '^https?://(www\.)?tiktok\.com/',
  '^https?://(www\.)?facebook\.com/',
]

# Cache – opakované běhy nekontrolují znovu odkazy ověřené v posledním dni
cache = true
max_cache_age = "1d"
